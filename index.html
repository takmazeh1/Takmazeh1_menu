<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تک مزه | منوی دیجیتال</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background:#0c0c0c;
    color:#f2f2f2;
    padding-bottom:60px;
  }
  header {
    text-align:center;
    padding:40px 20px 24px;
    background:#0c0c0c;
    border-bottom:1px solid #2a2a2a;
  }
  header h1 {
    font-size:34px;
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(90deg,#e8b64a,#c98a2c);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p {
    margin-top:6px;
    color:#c9a35a;
    font-size:14px;
    letter-spacing:0.5px;
  }
  nav {
    display:flex;
    overflow-x:auto;
    gap:10px;
    padding:16px 16px 8px;
    background:#101010;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid #2a2a2a;
  }
  nav button {
    flex:0 0 auto;
    background:#1a1a1a;
    color:#e5c17a;
    border:1px solid #333;
    border-radius:20px;
    padding:8px 18px;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    white-space:nowrap;
  }
  nav button.active {
    background:#c98a2c;
    color:#0c0c0c;
    font-weight:700;
    border-color:#c98a2c;
  }
  main { max-width:640px; margin:0 auto; padding:20px 16px; }
  section { display:none; }
  section.active { display:block; }
  section h2 {
    font-size:20px;
    color:#e8b64a;
    margin:18px 0 12px;
    border-right:3px solid #c98a2c;
    padding-right:10px;
  }
  .item {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    background:#161616;
    border:1px solid #262626;
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    min-height:64px;
  }
  .item-photo {
    width:64px;
    height:64px;
    border-radius:10px;
    object-fit:cover;
    flex:0 0 auto;
    border:1px solid #2a2a2a;
    cursor:pointer;
  }
  #lightbox {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  #lightbox.open { display:flex; }
  #lightbox img {
    max-width:100%;
    max-height:80vh;
    border-radius:12px;
    border:1px solid #333;
  }
  .item-main {
    display:flex;
    align-items:center;
    gap:12px;
    flex:1;
    min-width:0;
  }
  .item-group {
    background:#161616;
    border:1px solid #262626;
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .item-group h3 {
    font-size:16px;
    font-weight:700;
    color:#f2f2f2;
    margin-bottom:8px;
  }
  .item-group-header {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:8px;
  }
  .variant-row {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:8px 0;
    border-top:1px solid #232323;
  }
  .variant-row:first-of-type { border-top:none; }
  .variant-info .label {
    font-size:14px;
    font-weight:600;
    color:#e5c17a;
  }
  .variant-info p {
    font-size:12px;
    color:#9a9a9a;
    line-height:1.5;
    margin-top:2px;
  }
  .video-link {
    display:inline-flex;
    align-items:center;
    gap:4px;
    margin-top:4px;
    font-size:12px;
    color:#e8b64a;
    text-decoration:none;
  }
  .item-info h3 {
    font-size:16px;
    font-weight:700;
    color:#f2f2f2;
    margin-bottom:4px;
  }
  .item-info p {
    font-size:13px;
    color:#9a9a9a;
    line-height:1.6;
  }
  .price {
    font-size:15px;
    font-weight:700;
    color:#e8b64a;
    white-space:nowrap;
  }
  footer {
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:30px;
  }
</style>
</head>

const tabs = document.getElementById('tabs');
const menu = document.getElementById('menu');
Object.keys(data).forEach((cat, i) => {
  const btn = document.createElement('button');
  btn.textContent = cat;
  if (i===0) btn.classList.add('active');
  btn.onclick = () => showCat(cat);
  tabs.appendChild(btn);

  const sec = document.createElement('section');
  sec.id = 'cat-'+i;
  if (i===0) sec.classList.add('active');
  const h2 = document.createElement('h2');
  h2.textContent = cat;
  sec.appendChild(h2);
  data[cat].forEach(item => {
    if (item.variants) {
      const group = document.createElement('div');
      group.className = 'item-group';
      const header = document.createElement('div');
      header.className = 'item-group-header';
      const photoHtml = item.img ? `<img class="item-photo" src="${item.img}" alt="" loading="lazy" onerror="this.style.display='none'" onclick="openLightbox('${item.img}')">` : '';
      header.innerHTML = `${photoHtml}<h3 style="margin:0">${item.name}</h3>`;
      group.appendChild(header);
      item.variants.forEach(v => {
        const row = document.createElement('div');
        row.className = 'variant-row';
        const priceText = v.price ? (v.price) : '—';
        const descHtml = v.desc ? `<p>${v.desc}</p>` : '';
        row.innerHTML = `<div class="variant-info"><div class="label">${v.label}</div>${descHtml}</div><div class="price">${priceText}</div>`;
        group.appendChild(row);
      });
      sec.appendChild(group);
      return;
    }
    const div = document.createElement('div');
    div.className = 'item';
    const priceText = item.price ? (item.price) : '—';
    const photoHtml = item.img ? `<img class="item-photo" src="${item.img}" alt="" loading="lazy" onerror="this.style.display='none'" onclick="openLightbox('${item.img}')">` : '';
    const descHtml = item.desc ? `<p>${item.desc}</p>` : '';
    const videoHtml = item.video ? `<a class="video-link" href="${item.video}" target="_blank" rel="noopener">▶ پخش ویدیو</a>` : '';
    div.innerHTML = `<div class="item-main">${photoHtml}<div class="item-info"><h3>${item.name}</h3>${descHtml}${videoHtml}</div></div><div class="price">${priceText}</div>`;
    sec.appendChild(div);
  });
  menu.appendChild(sec);
});

function showCat(cat){
  const idx = Object.keys(data).indexOf(cat);
  document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active', i===idx));
  document.querySelectorAll('main section').forEach((s,i)=>s.classList.toggle('active', i===idx));
}

function openLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
</script>
